<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Versionador — Comunicação DP</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <!-- ── entrada ─────────────────────────────────────────── -->
    <section id="tela-login" class="entrada">
      <div class="cartao cartao--entrada">
        <div class="marca">
          <span class="marca__selo" aria-hidden="true">CD</span>
          <div>
            <h1 class="marca__nome">Versionador</h1>
            <p class="marca__sub">Comunicação DP</p>
          </div>
        </div>

        <label for="servidor">Servidor</label>
        <input id="servidor" type="text" spellcheck="false" placeholder="http://localhost:3000" />

        <label for="usuario">Usuário</label>
        <input id="usuario" type="text" spellcheck="false" autocomplete="off" />

        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="off" />

        <button id="btn-entrar" class="acao acao--bloco">Entrar</button>
        <p id="erro-login" class="erro" role="alert"></p>
      </div>
      <p class="rodape-entrada">Publica as versões do aplicativo e do servidor. Use a conta do TI.</p>
    </section>

    <!-- ── área de trabalho ────────────────────────────────── -->
    <main id="tela-principal" hidden>
      <header class="barra">
        <div class="barra__marca">
          <span class="marca__selo marca__selo--pequeno" aria-hidden="true">CD</span>
          <span class="barra__titulo">Versionador</span>
        </div>
        <div class="barra__sessao">
          <span id="quem" class="destaque"></span>
          <span id="onde" class="apagado"></span>
          <button id="btn-sair" class="link">Sair</button>
        </div>
      </header>

      <nav class="abas" role="tablist" aria-label="O que publicar">
        <button class="aba ativa" data-alvo="desktop" role="tab">Desktop</button>
        <button class="aba" data-alvo="mobile" role="tab">Celular · APK</button>
        <button
          class="aba"
          data-alvo="mobile-ota"
          role="tab"
          title="Atualização rápida: só o JavaScript, o app reinicia sozinho"
        >
          Celular · rápida
        </button>
        <button class="aba" data-alvo="backend" role="tab">Servidor</button>
      </nav>

      <section class="cartao">
        <h2 class="cartao__titulo">Publicar nova versão</h2>

        <div class="campo">
          <label for="btn-arquivo">Arquivo</label>
          <div class="linha">
            <button id="btn-arquivo" class="acao secundaria">Escolher arquivo…</button>
            <span id="arquivo-escolhido" class="apagado">nenhum arquivo escolhido</span>
          </div>
        </div>

        <div class="linha linha--campos">
          <div class="campo campo--curto">
            <label for="versao">Versão</label>
            <input id="versao" type="text" spellcheck="false" placeholder="1.5.0" class="curto" />
          </div>
          <label class="caixa">
            <input id="obrigatoria" type="checkbox" />
            <span>
              Atualização obrigatória
              <small>Instala mesmo com alguém usando o computador</small>
            </span>
          </label>
        </div>

        <div class="campo">
          <label for="notas">Notas da versão</label>
          <textarea
            id="notas"
            rows="3"
            placeholder="- corrige o aviso de mensagens não lidas&#10;- melhora a busca por setor"
          ></textarea>
        </div>

        <div class="linha linha--acao">
          <button id="btn-publicar" class="acao">Publicar</button>
          <span id="progresso" class="apagado"></span>
        </div>

        <p id="aviso" class="aviso" role="status"></p>
      </section>

      <section class="cartao">
        <h2 class="cartao__titulo">Versões publicadas</h2>
        <div id="lista" class="lista"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
